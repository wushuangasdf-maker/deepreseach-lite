[pytest]
; ── 导入路径 ───────────────────────────────────────────
; 将项目根目录加入 sys.path，使 `from core.xxx import ...`、
; `from tools.xxx import ...` 在测试中可直接导入，无需各模块的 sys.path hack。
pythonpath = .

; ── 测试发现 ───────────────────────────────────────────
; 只从 test/ 目录收集测试，避免收集项目里的手动联调脚本。
testpaths = test

; ── 覆盖率 ─────────────────────────────────────────────
; 运行 `pytest` 时自动对 core / agent / tools / api 生成覆盖率。
addopts =
    --cov=core
    --cov=tools
    --cov=agent
    --cov=api
    --cov-report=term-missing
    --cov-report=html:htmlcov
